name: Tests
on:
  workflow_dispatch:
jobs:
  unitTests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: npm update
        run: npm update
      - name: Run unit tests
        run: |
          cd test/triasm
          npx ts-node vectors.ts
