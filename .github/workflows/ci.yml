name: CI
on:
  push:
    branches: 
      master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: npm update
        run: npm update
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
